name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # 只保留这个仓库自己的测试。上游那套 sing-box 全平台矩阵
  # （3 个 OS × 2 个 Go 版本跑整个上游测试套件）已经删掉了：
  # 这个 fork 只部署 Linux，跑那 6 个 job 只是白烧 Actions 额度。
  vega:
    name: Vega Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race -tags with_v2ray_api,with_quic ./protocol/nowhere/... ./experimental/v2rayapi/... ./common/tls
      - run: go test -race ./route/rule -run TestVegaQUICPolicy
      - run: go test -race ./... && go vet ./...
        working-directory: panel
      - run: sh deploy/install_test.sh
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -o /tmp/vega-panel-linux .
        working-directory: panel
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/vega-panel-windows.exe .
        working-directory: panel
      - run: go test -race ./...
        working-directory: third_party/nowhere-go
      - run: go run ./cmd/nowhere-check -vectors
        working-directory: third_party/nowhere-go
      - run: go test -race ./... && go vet ./...
        working-directory: third_party/nowhere-go/cmd/nowhere
      - run: go test ./... && go vet ./...
        working-directory: tools/sbstats
      - run: go build -trimpath -o /tmp/vega -tags 'with_clash_api,with_v2ray_api,with_quic,with_utls' ./cmd/sing-box
      - run: VEGA_TEST_KERNEL=/tmp/vega go test -race ./...
        working-directory: panel
