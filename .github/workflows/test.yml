name: Test

on:
  push:
    branches:
      - main
      - oldstable
      - stable
      - testing
      - unstable
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - oldstable
      - stable
      - testing
      - unstable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  vega:
    name: Vega Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race -tags with_v2ray_api ./protocol/nowhere/... ./experimental/v2rayapi/...
      - run: go test -race ./... && go vet ./...
        working-directory: panel
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -o /tmp/vega-panel-linux .
        working-directory: panel
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/vega-panel-windows.exe .
        working-directory: panel
      - run: go test -race ./...
        working-directory: third_party/nowhere-go
      - run: go test ./... && go vet ./...
        working-directory: tools/sbstats
      - run: go build -o /tmp/vega -tags 'with_clash_api,with_v2ray_api' ./cmd/sing-box
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        go:
          - ~1.25
          - ~1.26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Set build tags and ldflags
        shell: bash
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Test (unix)
        if: matrix.os != 'windows-latest'
        run: go test -v -exec sudo -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...
      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -v -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...
