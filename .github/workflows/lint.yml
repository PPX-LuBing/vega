name: Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # 上游这里是个 10 个 GOOS/GOARCH 的矩阵（每个 job 一遍 golangci-lint，
  # 30 分钟超时），那是给 sing-box 的全平台发布用的。这个 fork 只部署
  # linux/amd64，所以只留这一个目标。
  lint:
    name: Lint linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.26
      - name: Cache go module
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: linux
          GOARCH: amd64
        with:
          version: latest
          args: --timeout=30m
          install-mode: binary
          verify: false
